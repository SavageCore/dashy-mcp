[project]
name = "dashy-mcp"
version = "0.1.1"
description = "MCP server for Dashy's REST API"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0.0"]

[project.scripts]
dashy-mcp = "dashy_mcp:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: hits a real Dashy instance (needs DASHY_URL/DASHY_TOKEN)"]
addopts = "-m 'not integration'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
